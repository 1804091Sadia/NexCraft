<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | NexCraft</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/png" href="/icons/favicon-32.png">
</head>
<body>
    <header class="site-header">
        <nav class="navbar">
            <a href="/index.html" class="logo">
                <span class="logo-mark">N</span>
                <span>NexCraft</span>
            </a>
            <div class="nav-actions">
                <a href="/login.html" class="btn btn-outline">Login</a>
            </div>
        </nav>
    </header>

    <main class="auth-page">
        <div class="auth-card">
            <a href="/login.html" class="auth-back">← Back to Login</a>

            <div class="auth-header">
                <div class="auth-icon">🔒</div>
                <h1>Choose a new password</h1>
                <p>The link in your email is valid for 15 minutes.</p>
            </div>

            <div id="message" class="alert" role="status" aria-live="polite" style="display:none;"></div>

            <form id="resetPasswordForm" novalidate>
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" class="form-control"
                        autocomplete="new-password" aria-describedby="passwordHint" required>
                    <p class="form-hint" id="passwordHint">At least 8 characters, with a letter and a number.</p>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-control"
                        autocomplete="new-password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
            </form>
        </div>
    </main>

    <footer class="site-footer">
        <p>© 2026 NexCraft. IT Talent &amp; Training Platform.</p>
    </footer>

    <script src="/js/common.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
