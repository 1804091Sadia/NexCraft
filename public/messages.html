<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages | NexCraft</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/png" href="/icons/favicon-32.png">
</head>
<body data-role="any" data-page="messages">

    <header class="site-header">
        <nav class="navbar">
            <a href="/" class="logo">
                <span class="logo-mark">N</span>
                <span>NexCraft</span>
            </a>
            <div class="nav-actions">
                <span class="nav-user" id="navUser"></span>
                <button type="button" class="btn btn-outline" onclick="logoutUser()">Logout</button>
            </div>
        </nav>
    </header>

    <div class="dashboard-layout">
        <aside class="sidebar" id="sidebar"></aside>

        <main class="dashboard-main">
            <div id="message" class="alert" role="status" aria-live="polite" hidden></div>

            <div class="page-head">
                <div>
                    <h1>Messages</h1>
                    <p>Conversations with employers, trainers and learners.</p>
                </div>
            </div>

            <div class="messenger" id="messenger">
                <div class="conversation-list" id="conversations"><div class="empty-state" aria-busy="true"><p>Loading…</p></div></div>
                <section class="thread" id="thread" aria-live="polite">
                    <div class="empty-state"><h3>Select a conversation</h3>
                    <p>Messages you send from an application or candidate profile appear here.</p></div>
                </section>
            </div>
        </main>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/messages.js"></script>
</body>
</html>
