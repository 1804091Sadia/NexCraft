<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | NexCraft</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/png" href="/icons/favicon-32.png">
</head>
<body>
    <header class="site-header">
        <nav class="navbar">
            <a href="/index.html" class="logo">
                <span class="logo-mark">N</span>
                <span>NexCraft</span>
            </a>
            <div class="nav-actions">
                <a href="/login.html" class="btn btn-outline">Login</a>
            </div>
        </nav>
    </header>

    <main class="auth-page">
        <div class="auth-card">
            <a href="/login.html" class="auth-back">← Back to Login</a>

            <div class="auth-header">
                <div class="auth-icon">🔑</div>
                <h1>Forgot your password?</h1>
                <p>Enter the email you registered with and we'll send you a reset link.</p>
            </div>

            <div id="message" class="alert" role="status" aria-live="polite" style="display:none;"></div>

            <form id="forgotPasswordForm" novalidate>
                <div class="form-group">
                    <label for="forgotEmail">Email Address</label>
                    <input type="email" id="forgotEmail" class="form-control"
                        placeholder="you@example.com" autocomplete="email" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
            </form>

            <div class="form-footer">
                Remembered it? <a href="/login.html">Back to login</a>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <p>© 2026 NexCraft. IT Talent &amp; Training Platform.</p>
    </footer>

    <script src="/js/common.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
