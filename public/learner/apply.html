<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NexCraft - Apply for Job</title>

    <link rel="stylesheet" href="/css/style.css">

    <link rel="icon" type="image/png" href="/icons/favicon-32.png">
</head>


<body class="module-sidebar-page" data-role="learner" data-page="applications" data-auto-sidebar="true">


    <header class="site-header">

        <div class="container navbar">

            <a href="/learner/dashboard.html" class="logo">
                <span class="logo-mark">N</span>
                <span>NexCraft</span>
            </a>


            <nav class="nav-links">

                <a href="/learner/dashboard.html">
                    Dashboard
                </a>

                <a href="/learner/profile.html">
                    Profile
                </a>

                <a href="/learner/jobs.html" class="active">
                    Jobs
                </a>
                <a href="/messages.html">Messages</a>
                <a href="/settings.html">Settings</a>

            </nav>


            <div class="nav-actions">

                <button class="btn btn-outline" onclick="logout()">
                    Logout
                </button>

            </div>

        </div>

    </header>



    <main class="page-container">

        <div class="container">


            <div class="dashboard-header">

                <div>

                    <h1>
                        Apply for Job
                    </h1>

                    <p>
                        Review the job and submit
                        your application.
                    </p>

                </div>

            </div>



            <div id="message" class="alert" style="display:none;"></div>



            <div style="
                display:grid;
                grid-template-columns:
                    1.5fr 1fr;
                gap:24px;
                align-items:start;
            ">


                <!-- Job information -->

                <div id="jobSummary" class="card">

                    <p>
                        Loading job information...
                    </p>

                </div>



                <!-- Application -->

                <div class="card">

                    <h2>
                        Application
                    </h2>

                    <p style="
                        color:var(--muted);
                        margin-bottom:25px;
                    ">
                        Submit your application
                        for this position.
                    </p>


                    <form id="applicationForm">


                        <div class="form-group">

                            <label for="coverLetter">
                                Cover Letter
                            </label>

                            <textarea id="coverLetter" name="cover_letter" class="form-control" rows="10"
                                placeholder="Write your cover letter..." required></textarea>

                        </div>


                        <div class="form-group">

                            <label>
                                CV
                            </label>

                            <div id="cvStatus" style="
                                padding:12px;
                                background:
                                    var(--bg);
                                border:
                                    1px solid
                                    var(--border);
                                border-radius:
                                    8px;
                            ">
                                Checking your CV...
                            </div>

                        </div>


                        <button type="submit" id="submitApplicationButton" class="btn btn-primary" style="
                            width:100%;
                            margin-top:10px;
                        ">
                            Submit Application
                        </button>


                        <a href="/learner/jobs.html" class="btn btn-secondary" style="
                            width:100%;
                            margin-top:12px;
                            text-align:center;
                        ">
                            Cancel
                        </a>


                    </form>

                </div>

            </div>

        </div>

    </main>



    <script src="/js/common.js"></script>
    <script src="/js/ui.js"></script>

    <script src="/learner/js/apply.js"></script>


</body>

</html>
