<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Candidates | NexCraft</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/png" href="/icons/favicon-32.png">
</head>
<body data-role="employer" data-page="candidates">

    <header class="site-header">
        <nav class="navbar">
            <a href="/" class="logo">
                <span class="logo-mark">N</span>
                <span>NexCraft</span>
            </a>
            <div class="nav-actions">
                <span class="nav-user" id="navUser"></span>
                <button type="button" class="btn btn-outline" onclick="logoutUser()">Logout</button>
            </div>
        </nav>
    </header>

    <div class="dashboard-layout">
        <aside class="sidebar" id="sidebar"></aside>

        <main class="dashboard-main">
            <div id="message" class="alert" role="status" aria-live="polite" hidden></div>

            <div class="page-head">
                <div>
                    <h1>Find Candidates</h1>
                    <p>Browse learner profiles by track, skill, rating and badge.</p>
                </div>
            </div>

            <form class="toolbar" id="searchForm">
                <div class="form-group">
                    <label for="q">Name</label>
                    <input id="q" class="form-control" placeholder="Search by name">
                </div>
                <div class="form-group">
                    <label for="track">Track</label>
                    <input id="track" class="form-control" placeholder="e.g. Web Development">
                </div>
                <div class="form-group">
                    <label for="skill">Skill</label>
                    <input id="skill" class="form-control" list="skillList" placeholder="e.g. JavaScript">
                    <datalist id="skillList"></datalist>
                </div>
                <div class="form-group">
                    <label for="badge">Badge</label>
                    <select id="badge" class="form-control"><option value="">Any badge</option></select>
                </div>
                <div class="form-group">
                    <label for="min_rating">Rating</label>
                    <select id="min_rating" class="form-control">
                        <option value="">Any rating</option>
                        <option value="4">★ 4 and up</option>
                        <option value="3">★ 3 and up</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Search</button>
            </form>

            <p class="muted" id="resultCount" style="margin-bottom:12px;"></p>
            <div id="candidates" class="card-grid"></div>
            <div class="pager" id="pager"></div>
        </main>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/employer/js/candidates.js"></script>
</body>
</html>
