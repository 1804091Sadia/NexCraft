<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | NexCraft</title>

    <link rel="stylesheet" href="/css/style.css">

    <link rel="icon" type="image/png" href="/icons/favicon-32.png">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="site-header">

        <nav class="navbar">

            <!-- Logo -->

            <a href="/index.html" class="logo">

                <span class="logo-mark">N</span>

                <span>NexCraft</span>

            </a>


            <!-- Navigation -->

            <div class="nav-links">

                <a href="/index.html">
                    Home
                </a>

                <a href="/register.html">
                    Register
                </a>

            </div>


            <!-- Right side -->

            <div class="nav-actions">

                <a href="/index.html" class="btn btn-outline">
                    Home
                </a>

            </div>


            <!-- Mobile menu -->

            <button type="button" class="menu-toggle" aria-label="Open menu">
                ☰
            </button>

        </nav>

    </header>


    <!-- ================= LOGIN ================= -->

    <main class="auth-page">

        <div class="auth-card">

            <!-- Back -->

            <a href="/index.html" class="auth-back">
                ← Back to Home
            </a>


            <!-- Header -->

            <div class="auth-header">

                <div class="auth-icon">
                    🔐
                </div>

                <h1>
                    Welcome Back
                </h1>

                <p>
                    Sign in to continue to NexCraft
                </p>

            </div>


            <!-- Error / Success Message -->

            <div id="message" class="alert" style="display:none;"></div>


            <!-- Login Form -->

            <form id="loginForm">

                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email"
                        required>

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input type="password" id="password" name="password" class="form-control"
                        placeholder="Enter your password" required>

                </div>


                <!-- Forgot Password -->

                <div style="
                text-align:right;
                margin-top:-8px;
                margin-bottom:20px;
                ">

                    <a href="/forgot-password.html" style="
                    color:var(--primary);
                    font-size:14px;
                    font-weight:600;
                    ">
                        Forgot Password?
                    </a>

                </div>


                <!-- Login Button -->

                <button type="submit" class="btn btn-primary" style="width:100%;">
                    Login
                </button>

            </form>


            <!-- Register -->

            <div class="form-footer">

                Don't have an account?

                <a href="/register.html">
                    Create an account
                </a>

            </div>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="site-footer">

        <p>
            © 2026 NexCraft. IT Talent & Training Platform.
        </p>

    </footer>


    <!-- Common JS -->

    <script src="/js/common.js"></script>

    <!-- Existing authentication JS -->

    <script src="/js/auth.js"></script>

</body>

</html>
